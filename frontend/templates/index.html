<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {sans: ['Inter', 'sans-serif']},
                    colors: {
                        ink: '#07111f',
                        signal: '#12b981',
                        graph: '#38bdf8',
                        audit: '#f59e0b',
                        threat: '#fb7185'
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in-up { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; }
        .fade-in-up.show { opacity: 1; transform: translateY(0); }
        .control-shell {
            background:
                linear-gradient(90deg, rgba(148, 163, 184, .08) 1px, transparent 1px),
                linear-gradient(rgba(148, 163, 184, .08) 1px, transparent 1px),
                #07111f;
            background-size: 36px 36px;
        }
        .module-tile {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transition: transform .28s ease, border-color .28s ease, background .28s ease;
        }
        .module-tile::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: .12;
            background: var(--module-accent);
            transform: translateY(74%);
            transition: transform .35s ease, opacity .35s ease;
        }
        .module-tile:hover { transform: translateY(-4px); }
        .module-tile:hover::before { transform: translateY(0); opacity: .2; }
        #moduleOrbitCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .module-orbit-stage {
            height: clamp(300px, 32vh, 360px);
            min-height: 300px;
            max-height: 360px;
        }
    </style>
</head>
<body class="min-h-full control-shell font-sans text-slate-100">

            </div>

                <div class="text-sm font-bold tracking-[0.24em] text-cyan-200">破壁者</div>

        </div>

            <span id="headerReportState" class="rounded-full border border-white/10 bg-white/5 px-3 py-1.5">报告 -- 份</span>
        </div>
    </nav>

    <section class="grid flex-1 grid-cols-1 gap-6 py-8 xl:grid-cols-[0.68fr_1.32fr]">
        <div id="systemIdentityPanel" class="fade-in-up flex min-h-[520px] flex-col justify-between rounded-2xl border border-white/10 bg-white/[0.04] p-6 shadow-2xl shadow-black/30">
            <div>
                <div class="mb-5 inline-flex items-center gap-2 rounded-full border border-cyan-300/20 bg-cyan-300/10 px-4 py-2 text-xs font-bold uppercase tracking-[0.22em] text-cyan-100">
                    <span class="h-2 w-2 rounded-full bg-cyan-300 animate-pulse"></span>
                    可解释防御系统
                </div>
                <h1 class="max-w-4xl text-3xl font-extrabold leading-tight tracking-normal text-white xl:text-4xl">
                    破壁者:基于数据流特征进化图谱的人脸伪造检测与追溯系统
                </h1>
                <div class="mt-6 grid grid-cols-3 gap-2 text-center text-xs font-semibold text-slate-300">
                    <span class="rounded-xl border border-cyan-300/20 bg-cyan-300/10 px-3 py-2">数据流特征</span>
                    <span class="rounded-xl border border-emerald-300/20 bg-emerald-300/10 px-3 py-2">进化图谱</span>
                    <span class="rounded-xl border border-amber-300/20 bg-amber-300/10 px-3 py-2">证据追溯</span>
                </div>
            </div>

            <div class="mt-8 grid grid-cols-1 gap-3">
                <div class="rounded-2xl border border-emerald-300/20 bg-emerald-300/10 p-5">
                    <div class="text-xs tracking-[0.18em] text-emerald-200">最新准确率</div>
                    <div id="latestAccuracy" class="mt-3 text-4xl font-extrabold text-white">--</div>
                    <div id="latestReportName" class="mt-2 text-sm text-emerald-100/80">等待报告同步</div>
                    <div class="mt-4">
                        <a id="reportHistoryLink"
                           href="report-history.html"
                           class="inline-flex w-full items-center justify-between rounded-xl border border-emerald-200/30 bg-slate-950/45 px-4 py-3 text-left text-sm font-semibold text-emerald-50 transition-colors hover:border-emerald-100/60 hover:bg-slate-900/80">
                            <span>打开历史报告</span>
                            <span id="reportHistoryLinkCount" class="text-xs font-medium text-emerald-100/70">--</span>
                        </a>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="rounded-2xl border border-sky-300/20 bg-sky-300/10 p-4">
                        <div class="text-xs tracking-[0.18em] text-sky-200">样本规模</div>
                        <div id="latestSamples" class="mt-2 text-3xl font-extrabold text-white">--</div>
                    </div>
                    <div class="rounded-2xl border border-amber-300/20 bg-amber-300/10 p-4">
                        <div class="text-xs tracking-[0.18em] text-amber-200">报告汇总</div>
                        <div id="reportCount" class="mt-2 text-3xl font-extrabold text-white">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="fade-in-up grid min-h-[520px] grid-rows-[auto_auto] gap-5 self-start">
            <div id="coreModuleGrid" class="grid grid-cols-2 gap-5">
                <a href="image-recognition.html"
                   class="module-tile min-h-[170px] rounded-2xl border border-emerald-300/25 bg-emerald-300/10 p-6"
                   style="--module-accent: #10b981;">
                    <div class="text-xs tracking-[0.18em] text-emerald-200">检测识别</div>
                    <h2 class="mt-3 text-2xl font-bold text-white">虚假人脸识别</h2>
                    <p class="mt-2 text-sm leading-6 text-emerald-50/80">当前样本预览与证据子图同屏呈现。</p>
                </a>
                <a href="visualization.html#metric-report"
                   class="module-tile min-h-[170px] rounded-2xl border border-sky-300/25 bg-sky-300/10 p-6"
                   style="--module-accent: #38bdf8;">
                    <div class="text-xs tracking-[0.18em] text-sky-200">建模看板</div>
                    <h2 class="mt-3 text-2xl font-bold text-white">统一指标看板</h2>
                    <p class="mt-2 text-sm leading-6 text-sky-50/80">折线、环图、雷达与图谱物理场。</p>
                </a>
                <a href="graph-iteration.html"
                   class="module-tile min-h-[170px] rounded-2xl border border-rose-300/25 bg-rose-300/10 p-6"
                   style="--module-accent: #fb7185;">
                    <div class="text-xs tracking-[0.18em] text-rose-200">图谱进化</div>
                    <h2 class="mt-3 text-2xl font-bold text-white">图谱进化配置</h2>
                    <p class="mt-2 text-sm leading-6 text-rose-50/80">提示词驱动候选节点与规则迭代。</p>
                </a>
                <a href="evidence-chain-report.html"
                   class="module-tile min-h-[170px] rounded-2xl border border-amber-300/25 bg-amber-300/10 p-6"
                   style="--module-accent: #f59e0b;">
                    <div class="text-xs tracking-[0.18em] text-amber-200">证据审计</div>
                    <h2 class="mt-3 text-2xl font-bold text-white">证据链审计</h2>
                    <p class="mt-2 text-sm leading-6 text-amber-50/80">结构化证据链与法医式输出入口。</p>
                </a>
            </div>

            <div class="module-orbit-stage relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900/70">
                <canvas id="moduleOrbitCanvas" width="980" height="360"></canvas>
                <div class="pointer-events-none absolute left-6 top-6">
                    <div class="text-xs tracking-[0.2em] text-slate-400">物理导航场</div>
                    <div class="mt-1 text-2xl font-bold text-white">模块碰撞态势</div>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
const initialReportGallery = {{ report_gallery | tojson }};

function formatNumber(value) {
    return new Intl.NumberFormat('zh-CN').format(Number(value || 0));
}

function formatPercent(value) {
    const numeric = Number(value || 0);
    return `${numeric.toFixed(2)}%`;
}

function updateCommandSurface(gallery) {
    const latest = gallery.latest || {};
    const metrics = latest.metrics || {};
    const reportCount = gallery.overview?.report_count || 0;
    document.getElementById('latestAccuracy').textContent = formatPercent(metrics.accuracy_valid_pct || 0);
    document.getElementById('latestSamples').textContent = formatNumber(metrics.total_samples || 0);
    document.getElementById('reportCount').textContent = formatNumber(reportCount);
    document.getElementById('latestReportName').textContent = latest.title || '暂无基准评测报告';
    document.getElementById('headerReportState').textContent = `报告 ${formatNumber(reportCount)} 份`;
    document.getElementById('reportHistoryLinkCount').textContent = `${formatNumber(reportCount)} 份`;
}

function clampOrbitNode(node, width, height) {
    let bounced = false;
    if (node.x * width < node.r || node.x * width > width - node.r) {
        node.vx *= -1;
        bounced = true;
    }
    if (node.y * height < node.r || node.y * height > height - node.r) {
        node.vy *= -1;
        bounced = true;
    }
    node.x = Math.max(node.r / width, Math.min(1 - node.r / width, node.x));
    node.y = Math.max(node.r / height, Math.min(1 - node.r / height, node.y));
    return bounced;
}

function startModuleOrbitCanvas() {
    const canvas = document.getElementById('moduleOrbitCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const modules = [
        {label: '检测', x: .32, y: .38, vx: .86, vy: .46, r: 38, color: '#10b981'},
        {label: '图谱', x: .64, y: .34, vx: -.64, vy: .72, r: 42, color: '#38bdf8'},
        {label: '报告', x: .42, y: .66, vx: .70, vy: -.62, r: 40, color: '#f59e0b'},
        {label: '审计', x: .72, y: .63, vx: -.78, vy: -.40, r: 36, color: '#fb7185'}
    ];
    const ripples = [];

    function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function tick() {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);

        modules.forEach(node => {
            node.px = node.x * w;
            node.py = node.y * h;
            node.x += node.vx / w;
            node.y += node.vy / h;
            if (clampOrbitNode(node, w, h)) {
                ripples.push({x: node.x * w, y: node.y * h, color: node.color, life: 0});
            }
        });

        for (let i = 0; i < modules.length; i += 1) {
            for (let j = i + 1; j < modules.length; j += 1) {
                const a = modules[i];
                const b = modules[j];
                const dx = a.x * w - b.x * w;
                const dy = a.y * h - b.y * h;
                const distance = Math.hypot(dx, dy);
                const minDistance = a.r + b.r + 18;
                if (distance < minDistance) {
                    [a.vx, b.vx] = [b.vx, a.vx];
                    [a.vy, b.vy] = [b.vy, a.vy];
                    ripples.push({x: (a.x * w + b.x * w) / 2, y: (a.y * h + b.y * h) / 2, color: '#e2e8f0', life: 0});
                }
            }
        }

        ripples.forEach((ripple, index) => {
            ripple.life += 1;
            const radius = ripple.life * 3.8;
            ctx.strokeStyle = ripple.color;
            ctx.globalAlpha = Math.max(0, .32 - ripple.life / 120);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ripple.x, ripple.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
            if (ripple.life > 70) {
                ripples.splice(index, 1);
            }
        });

        modules.forEach((a, index) => {
            modules.slice(index + 1).forEach(b => {
                ctx.strokeStyle = 'rgba(148, 163, 184, .22)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x * w, a.y * h);
                ctx.lineTo(b.x * w, b.y * h);
                ctx.stroke();
            });
        });

        modules.forEach(node => {
            const x = node.x * w;
            const y = node.y * h;
            const gradient = ctx.createRadialGradient(x - 12, y - 12, 6, x, y, node.r);
            gradient.addColorStop(0, node.color);
            gradient.addColorStop(1, 'rgba(15, 23, 42, .92)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, node.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = `${node.color}aa`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 14px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.label, x, y);
        });

        requestAnimationFrame(tick);
    }

    function scheduleResize() {
        requestAnimationFrame(resize);
    }

    resize();
    window.addEventListener('resize', scheduleResize);
    if (window.ResizeObserver && canvas.parentElement) {
        const resizeObserver = new ResizeObserver(scheduleResize);
        resizeObserver.observe(canvas.parentElement);
    }
    tick();
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.fade-in-up').forEach(el => el.classList.add('show'));
    updateCommandSurface(initialReportGallery || {overview: {}});
    startModuleOrbitCanvas();
});
</script>
</body>
</html>
